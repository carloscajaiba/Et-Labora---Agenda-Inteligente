<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Carlos Eduardo">
    <meta name="keywords" content="Agenda, Organização, Trabalho">
    <meta namme="description" content="Website da Et Labora">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Et Labora</title>
<style>
/* Body */
body{
  padding-bottom: 55px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

html,body {
  height: 100%;
}
/* Body */

/* Sombreamento */
.header{
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4); 
}

.header {
  box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
}
/* Sombreamento */

/* Header */
.header {
  width: 100%;
  display: flex;
  height: 110px;
  background-color: #495EEE;
  padding: 20px 40px;      
  color: #fff;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 1;
  flex-shrink: 0;
}

.logo {
  font-size: 2rem;
  font-weight: bold;
}

.menu {
  list-style: none; 
  gap: 40px;
  font-weight: bold;
  display: flex;
  justify-content: center;
}

.menu li a {
  color: #fff;
  text-decoration: none;
  transition: color 0.3s ease;
  font-size: 1.2rem;
}
/* Header */

/* Main */
main {
  flex: 1;
  min-height: 0;
  width: 100%;
}

main iframe {
  display: block;
  width: 100%;
  height: 100% !important;
}
/* Main */

/* Footer */
.footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 55px;
  background-color: #495EEE;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}
/* Footer */


/* Mobile */
@media (max-width: 900px) {
  .header {
    height: auto;
    min-height: 110px;
    padding: 20px 28px;
    gap: 20px;
    flex-wrap: wrap;
  }

  .menu {
    gap: 18px 26px;
    flex-wrap: wrap;
  }

  .footer {
    padding: 10px 16px;
    text-align: center;
    line-height: 1.4;
  }
}

@media (max-width: 600px) {
  .header {
    height: auto;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px 16px;
    gap: 16px;
  }

  .logo {
    font-size: 1.8rem;
  }

  nav {
    width: 100%;
  }

  .menu {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    width: 100%;
    text-align: center;
  }

  .menu li a {
    display: block;
    padding: 7px 3px;
    font-size: 0.95rem;
  }

  main {
    width: 100%;
    min-width: 0;
  }

  main iframe {
    display: block;
    width: 100%;
    height: calc(100dvh - 190px) !important;
    min-height: 420px;
    border: 0;
  }

  .footer {
    min-height: 62px;
    height: auto;
    padding: 10px 12px;
    font-size: 0.75rem;
    line-height: 1.35;
  }
}

@media (max-width: 360px) {
  .menu li a {
    font-size: 0.85rem;
  }

  main iframe {
    height: calc(100dvh - 190px) !important;
  }

  .footer {
    font-size: 0.7rem;
  }
}

@media (max-width: 600px) {
  body {
    padding-bottom: 62px;
  }
}
/* Mobile */

</style>
</head>
<body>
    <header class="header">
  <div class="logo"> Et Labora </div>

  <nav>
    <ul class="menu">
      <li><a href="home.html">  INÍCIO  </a></li>
      <li><a href="calendar.html">  CALENDÁRIO  </a></li>
      <li><a href="trabalhos.html"> TRABALHOS </a></li>
      <li><a href="equipamentos.html">  EQUIPAMENTOS  </a></li>
    </ul>
  </nav>
    </header>
    <main>
      <iframe src="https://calendar.google.com/calendar/embed?src=carlos.cajaiba%40ba.estudante.senai.br&ctz=America%2FBahia" style="border: 0" width="100%" height="780px" frameborder="0" scrolling="no"></iframe>
    </main>

    <footer class="footer"> Carlos Eduardo de Almeida Cajaiba © 2026 - Todos os direitos reservados - Proteção de Dados </footer>
</body>
</html>
